services:
    mosquitto:
        container_name: mqtt-broker
        image: eclipse-mosquitto:2.0.20
        restart: always
        ports:
            - 1883:1883
        volumes:
            - ./docker/mosquitto/config:/mosquitto/config
            - ./docker/mosquitto/data:/mosquitto/data
            - ./docker/mosquitto/log:/mosquitto/log
        networks:
            - tonttutrack-network
    tonttutrack:
        container_name: tonttutrack-web
        image: tonttutrack-csharp-image
        ports:
            - 5001:8080
        depends_on:
            - mssql
        networks:
            - tonttutrack-network
    mssql:
        container_name: tonttutrack-database
        image: mcr.microsoft.com/mssql/server:2022-latest
        restart: always
        environment:
            ACCEPT_EULA: Y
            MSSQL_SA_PASSWORD: V3ryStr@ngP3ssw0rd
        ports:
            - 5000:1433
        volumes:
            - db-data:/var/opt/mssql
        networks:
            - tonttutrack-network
volumes:
    db-data: {}
networks:
  tonttutrack-network:
    driver: bridge
    name: tonttutrack-network